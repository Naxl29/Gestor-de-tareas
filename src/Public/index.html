<!DOCTYPE html>
 <html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas</title>
  <link rel="stylesheet" href="styles.css">
 </head>
 <body>
  <div class="container">
  <header>
  <h1>NOTAS</h1>
  <div class="profile-container">
  <div class="profile-image">
  <img src="7979904.jpg" alt="Perfil">
  </div>
  <span class="profile-text"></span>
  </div>
  </header>
  <main>
  <div class="new-note-container">
  <h2>Nueva nota</h2>
  <div class="input-group">
  <label for="titulo">Título</label>
  <input type="text" id="titulo" placeholder="Título de la nota">
  </div>
  <div class="input-group">
  <label for="contenido">Contenido de la nota</label>
  <textarea id="contenido" placeholder="Escribe el contenido de tu nota"></textarea>
  </div>
  <button class="button" data-text="Awesome">
  <span class="actual-text">&nbsp;GUARDAR&nbsp;</span>
  <span aria-hidden="true" class="hover-text">&nbsp;GUARDAR&nbsp;</span>
  </button>
  </div>
  <div class="notes-list-container">
  <h2>Notas</h2>
  <div class="notes-list">
  <p class="empty-message">No existen notas que mostrar</p>
  </div>
  </div>
  </main>
  </div>
 </body>
 </html>
