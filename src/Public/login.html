<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" href="/img/icono.ico" type="image/x-icon">

</head>
<body>
    <div class="wrapper">
        <div class="card-switch">
            <label class="switch">
                <input type="checkbox" class="toggle">
                <span class="slider"></span>
                <span class="card-side"></span>
                <div class="flip-card__inner">
                    <div class="flip-card__front">
                        <div class="title">INICIAR SESIÓN</div>
                        
                        <!-- Formulario de login -->
                        <form id="loginForm" class="flip-card__form" onsubmit="return false;" autocomplete="off">
                            <input class="flip-card__input" name="email" placeholder="Correo" type="email" autocomplete="off">
                            <input class="flip-card__input" name="password" placeholder="Contraseña" type="password" autocomplete="off">
                            <button type="submit" class="flip-card__btn">INICIAR</button>
                            <p class="flip-card__text">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
                        </form>
                    </div>
                </div>
            </label>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/login.js"></script>

    <!-- Script para el botón toggle -->
    <script>
        const toggle = document.querySelector('.toggle');
        let timeout;

        toggle.addEventListener('change', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                if (toggle.checked) {
                    window.location.href = 'register.html';
                } else {
                    window.location.href = 'login.html';
                }
            }, 200); // Espera 200ms antes de redirigir
        });
    </script>
</body>
</html>
