<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    
</head>
<body>

      <!--ALERTA OCULTA-->
    <div id="alert-edit" class="alert alert-danger alewrt-dismissible fade show mt-3 mb-3 mx-auto" role="alert">
        <stroid id="tilte-alert"> ¡ATENCIÓN!</strong> No puedes dejar espacios en blanco. </stroid>
        <button id= "btn-alert-edit" type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

        <div class="container">
        <header>
            <h1>TAREAS</h1>
            <div class="profile-container">
                <div class="profile-image">
                    <a href="detalles.html"><img src="7979904.jpg" alt="Perfil"></a>
                </div>
                <span class="profile-text"></span>
            </div>
        </header>
        <main>
            <form class="new-note-container" action="/api/saveTarea" method="post">  <!-- Agregue la ruta para manejar los registros de las nueva tareas -->
                <h2>Nueva tarea</h2>
                <div class="input-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" name="title" placeholder="Título de la tarea">
                </div>
                <div class="input-group">
                    <label for="description">Contenido de la tarea</label>
                    <textarea id="description" name="description" placeholder="Escribe el contenido de tu tarea"></textarea>
                </div>
                <input type="submit" class="button" id="btnEdit" value="ACTUALIZAR">
            </form>
        </main>

    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="js/editTarea.js"></script>
</body>
</html>
