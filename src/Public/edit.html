<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarea</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: #f8f9fa;">

    <div class="container" style="max-width: 500px;">
        <h1 class="text-center mb-4">Editar tarea</h1>

        <!-- ALERTA OCULTA -->
        <div id="alert-edit" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
            <strong id="title-alert">¡Atención!</strong> No puedes dejar espacios en blanco.
            <button type="button" class="btn-close" id="btn-alert-edit" aria-label="Close"></button>
        </div>

        <!-- FORMULARIO -->
        <form>
            <div class="mb-3">
                <label for="title" class="form-label">Título</label>
                <input type="text" id="title" class="form-control" placeholder="Ingrese título">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Descripción</label>
                <textarea id="description" class="form-control" placeholder="Ingrese descripción" rows="4"></textarea>
            </div>

            <div class="d-grid">
                <button type="button" id="update" class="btn btn-primary">Actualizar tarea</button>
            </div>
        </form>
    </div>

    <script src="editNote.js"></script>
</body>
</html>
