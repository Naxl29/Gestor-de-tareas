<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/img/icono.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/main.css">
    
</head>
<body>

        <div class="container">
        <header>
            <h1>EDITAR TAREA</h1>
            <div class="profile-container">
                <div class="profile-image">
                    <a href="perfil.html"><img src="img/Buho.jpg" alt="Perfil"></a>
                </div>
                <span class="profile-text"></span>
            </div>
        </header>
        <main>
            <form>  
                <h2>Nueva tarea</h2>
                <div class="input-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" name="title" placeholder="Título de la tarea" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="description">Contenido de la tarea</label>
                    <textarea id="description" name="description" placeholder="Escribe el contenido de tu tarea" autocomplete="off"></textarea>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="button" id="btnEdit">ACTUALIZAR</button>
                    <a href="tareas.html" class="button_cancelar"> CANCELAR</a>
                </div>

            </form>
        </main>

    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/editTarea.js"></script>
</body>
</html>
