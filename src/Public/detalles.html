<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Perfil</title>
    <link rel="stylesheet" href="/src/Public/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="perfil-card">
        <div class="perfil-header">
            <div class="foto-container-desktop">
                <img src="7979904.jpg" alt="Tu Foto de Perfil" class="foto-perfil-desktop foto-clickable">
            </div>
            <h2 class="nombre-desktop">Tu Nombre Completo</h2>
            <p class="rol-desktop">Administrador de Tareas</p>
        </div>
        <div class="perfil-body-desktop">
            <div class="info-desktop">
                <p><i class="fas fa-envelope"></i> <a href="mailto:tu_correo@ejemplo.com">tu_correo@ejemplo.com</a></p>
                <p><i class="fas fa-user-cog"></i> ID de Usuario: <span class="user-id">TU_ID_USUARIO</span></p>
                <p><i class="fas fa-calendar-alt"></i> Cuenta desde: <span class="creation-date">DD/MM/AAAA</span></p>
            </div>
            <div class="estadisticas-desktop">
                <h3>Estadísticas de Tareas</h3>
                <ul>
                    <li><i class="fas fa-check-circle"></i> Completadas: <span class="tareas-completadas">125</span></li>
                    <li><i class="fas fa-tasks"></i> Pendientes: <span class="tareas-pendientes">15</span></li>
                    <li><i class="fas fa-exclamation-triangle"></i> Urgentes: <span class="tareas-urgentes">3</span></li>
                </ul>
            </div>
            <div class="cta-button-desktop">
                <a href="index.html">Volver</a>
            </div>
        </div>
    </div>

    <div id="fotoModal" class="modal">
        <span class="close-button">&times;</span>
        <img class="modal-content" id="imgModal">
    </div>

    <script>
        const fotoClickable = document.querySelector('.foto-clickable');
        const modal = document.getElementById('fotoModal');
        const modalImg = document.getElementById('imgModal');
        const closeButton = document.querySelector('.close-button');
        const originalSrc = fotoClickable ? fotoClickable.src : '';

        if (fotoClickable) {
            fotoClickable.addEventListener('click', function() {
                modal.style.display = "block";
                modalImg.src = this.src;
            });
        }

        if (closeButton) {
            closeButton.addEventListener('click', function() {
                modal.style.display = "none";
            });
        }

        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        });
    </script>

</body>
</html>
