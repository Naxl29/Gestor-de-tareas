<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="perfil-card">
    <div class="perfil-header">
        <div class="foto-container-desktop text-center">
            <img src="7979904.jpg" alt="Tu Foto de Perfil" class="foto-perfil-desktop foto-clickable">
        </div>
        <div class="text-center">
            <h3 id="nombre-desktop" class="nombre-desktop">Tu Nombre Completo</h3>
            <input id="nombre-input" type="text" style="display: none;" value="Tu Nombre Completo">

            <i class="fas fa-save guardar-estadistica" id="guardar-nombre-btn" style="display: none;"></i>
            <p class="rol-desktop mt-2 text-center"><i class="fas fa-info-circle"></i> Información Personal</p>
        </div>
    </div>
        <div class="cta-button-desktop">
            <a href="tareas.html">Volver</a>
        </div>
    </div>
</div>

<div id="fotoModal" class="modal">
    <span class="close-button">&times;</span>
    <img class="modal-content" id="imgModal">
</div>

<script src="./js/detalles.js"></script>
