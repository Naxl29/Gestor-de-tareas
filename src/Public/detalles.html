<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Perfil</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>

<div class="perfil-card">
    <div class="perfil-header">
        <div class="foto-container-desktop text-center">
            <img src="7979904.jpg" alt="Tu Foto de Perfil" class="foto-perfil-desktop foto-clickable">
        </div>
        <div class="text-center">
            <h3 id="nombre-desktop" class="nombre-desktop">Tu Nombre Completo</h3>
            <input id="nombre-input" type="text" style="display: none;" value="Tu Nombre Completo">
            <i class="fas fa-edit editar-estadistica" id="editar-nombre-btn"></i>
            <i class="fas fa-save guardar-estadistica" id="guardar-nombre-btn" style="display: none;"></i>
            <p class="rol-desktop mt-2 text-center"><i class="fas fa-info-circle"></i> Información Personal</p>
        </div>
    </div>
    <div class="perfil-body-desktop">
        <div class="info-desktop">
            <p><i class="fas fa-envelope"></i> <a href="mailto:tu_correo@ejemplo.com">tu_correo@ejemplo.com</a></p>
            <p><i class="fas fa-user-cog"></i> ID de Usuario: <span class="user-id">TU_ID_USUARIO</span></p>
            <p><i class="fas fa-calendar-alt"></i> Cuenta desde: <span class="creation-date">DD/MM/AAAA</span></p>
        </div>
        <div class="habilidades-desktop">
        <br>
            <h5 class="text-center">Habilidades</h5>
                <li>
                    <i class="fas fa-check-circle"></i>
                    <span id="habilidad-1">Liderazgo</span>
                    <input id="habilidad-1-input" type="text" style="display: none;" value="Liderazgo">
                    <i class="fas fa-edit editar-estadistica" id="editar-habilidad-1-btn"></i>
                    <i class="fas fa-save guardar-estadistica" id="guardar-habilidad-1-btn" style="display: none;"></i>
                </li>
                <li>
                    <i class="fas fa-check-circle"></i>
                    <span id="habilidad-2">Comunicación</span>
                    <input id="habilidad-2-input" type="text" style="display: none;" value="Comunicación">
                    <i class="fas fa-edit editar-estadistica" id="editar-habilidad-2-btn"></i>
                    <i class="fas fa-save guardar-estadistica" id="guardar-habilidad-2-btn" style="display: none;"></i>
                </li>
                <li>
                    <i class="fas fa-check-circle"></i>
                    <span id="habilidad-3">Resolución de problemas</span>
                    <input id="habilidad-3-input" type="text" style="display: none;" value="Resolución de problemas">
                    <i class="fas fa-edit editar-estadistica" id="editar-habilidad-3-btn"></i>
                    <i class="fas fa-save guardar-estadistica" id="guardar-habilidad-3-btn" style="display: none;"></i>
                </li>
        </div>
        <div class="cta-button-desktop">
            <a href="tareas.html">Volver</a>
        </div>
    </div>
</div>

<div id="fotoModal" class="modal">
    <span class="close-button">&times;</span>
    <img class="modal-content" id="imgModal">
</div>

<script src="./js/detalles.js"></script>
</body>
</html>
