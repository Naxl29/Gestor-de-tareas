<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Perfil</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>

<body>

<div class="perfil-card">
    <div class="perfil-header">
        <div class="foto-container-desktop text-center">
            <img src="img/Buho.jpg" alt="Tu Foto de Perfil" class="foto-perfil-desktop foto-clickable" id="foto-perfil">
        </div>

            <div class="text-center">
                <h2 id="nombre-desktop" class="nombre-desktop d-flex justify-content-center align-items-center">
                    Tu Nombre Completo
                    <button id="editar-nombre-btn" class="btn-icon ml-2">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button id="guardar-nombre-btn" class="btn-icon ml-2" style="display: none;">
                        <i class="fas fa-save"></i>
                    </button>
                </h2>
                <input id="nombre-input" type="text" class="form-control w-50 mx-auto" style="display: none;"
                    value="Tu Nombre Completo">
            </div>
            <p class="rol-desktop mt-2 text-center"><i class="fas fa-info-circle"></i> Información Personal</p>
        </div>

        <div class="cta-button-desktop">
            <a href="tareas.html">Volver</a>
        </div>
    </div>

    <div id="fotoModal" class="modal">
        <span class="close-button">&times;</span>
        <img class="modal-content" id="imgModal">
    </div>

    <script src="./js/detalles.js"></script>
</body>
</html>
