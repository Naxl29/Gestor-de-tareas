<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Perfil</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <h1>Detalles de tu Perfil</h1>

    <div class="profile-card">
        <div id="profile-details">
            <div class="profile-info-item">
                <span class="profile-label">Nombre:</span>
                <span id="profile-name" class="profile-value"></span>
            </div>
            <div class="profile-info-item">
                <span class="profile-label">Correo Electrónico:</span>
                <span id="profile-email" class="profile-value"></span>
            </div>
            <div class="profile-info-item">
                <span class="profile-label">Fecha de Registro:</span>
                <span id="profile-registration-date" class="profile-value"></span>
            </div>
        </div>
        <a href="menu.html"><button onclick="logout()" class="logout-button">Cerrar Sesión</button></a>
    </div>

</body>
</html>
