<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>TAREAS</h1>
            <div class="profile-container">
                <div class="profile-image">
                    <a href="detalles.html"><img src="7979904.jpg" alt="Perfil"></a>
                </div>
                <span class="profile-text"></span>
            </div>
        </header>
        <main>
            <div class="new-note-container">
                <h2>Nueva tarea</h2>
                <div class="input-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Título de la tarea">
                </div>
                <div class="input-group">
                    <label for="contenido">Contenido de la tarea</label>
                    <textarea id="contenido" placeholder="Escribe el contenido de tu tarea"></textarea>
                </div>
                <input type="submit" class="button" value="GUARDAR">
            </div>
            <div class="notes-list-container">
                <h2>Tareas</h2>
                <div class="notes-list">
                    <p class="empty-message">No existen Tareas que mostrar</p>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
