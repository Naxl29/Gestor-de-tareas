<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>TAREAS</h1>
            <div class="profile-container">
                <div class="profile-image">
                    <a href="detalles.html"><img src="7979904.jpg" alt="Perfil"></a>
                </div>
                <span class="profile-text"></span>
            </div>
        </header>
        <main>
            <div class="new-note-container">
                <h2>Nueva tarea</h2>
                <div class="input-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Título de la nota">
                </div>
                <div class="input-group">
                    <label for="contenido">Contenido de la tarea</label>
                    <textarea id="contenido" placeholder="Escribe el contenido de tu nota"></textarea>
                </div>
                <button class="button" data-text="Awesome">
                    <span class="actual-text">&nbsp;GUARDAR&nbsp;</span>
                    <span aria-hidden="true" class="hover-text">&nbsp;GUARDAR&nbsp;</span>
                </button>
            </div>
            <div class="notes-list-container">
                <h2>Notas</h2>
                <div class="notes-list">
                    <p class="empty-message">No existen tareas que mostrar</p>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
