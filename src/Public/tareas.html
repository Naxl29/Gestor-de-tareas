<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea</title>
    <link rel="stylesheet" href="/css/main.css">
    
</head>

<body>
    <div class="container">
        <header>
            <h1>TAREAS</h1>
            <div class="profile-container">
                <div class="profile-image">
                    <a href="detalles.html"><img src="7979904.jpg" alt="Perfil"></a>
                </div>
                <span class="profile-text"></span>
            </div>
        </header>
        <main>
            <form class="new-note-container" action="/api/saveTarea" method="post">  <!-- Agregue la ruta para manejar los registros de las nueva tareas -->
                <h2>Nueva tarea</h2>
                <div class="input-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" name="title" placeholder="Título de la tarea">
                </div>
                <div class="input-group">
                    <label for="description">Contenido de la tarea</label>
                    <textarea id="description" name="description" placeholder="Escribe el contenido de tu tarea"></textarea>
                </div>
                <input type="submit" class="button" value="GUARDAR">
            </form>
            <div class="notes-list-container">
                <h2>Tareas</h2>
                <div id="show-tareas" class="notes-list">
                    <p id="message" class="empty-message">No existen Tareas que mostrar</p>
                </div>
            </div>
        </main>
    </div>
    <script src="js/getTareas.js"></script>
   <script src="js/newTarea.js"></script>
   
</body>

</html>
