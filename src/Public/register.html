<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="wrapper">
        <div class="card-switch">
            <label class="switch">
               <input type="checkbox" class="toggle" checked>
                <span class="slider"></span>
                <span class="card-side"></span>
                <div class="flip-card__inner">

                    <div class="flip-card__back">
                        <div class="title">Regístrate</div>
                        <form class="flip-card__form" id="formRegistro" onsubmit="return false;">
                            <input id="name" class="flip-card__input" name="name" placeholder="Nombre" type="text">
                            <input id="email" class="flip-card__input" name="email" placeholder="Correo" type="email">
                            <input id="password" class="flip-card__input" name="password" placeholder="Contraseña" type="password">
                            <button id="btnRegistro" class="flip-card__btn" type="button">REGISTRAR</button>
                            <p class="flip-card__text">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>

                        </form>
                    </div>

                </div>
            </label>
        </div>
    </div>
    <script>
        const toggle = document.querySelector('.toggle');
        let timeout;

        toggle.addEventListener('change', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                if (toggle.checked) {
                    window.location.href = 'register.html';
                } else {
                    window.location.href = 'login.html';
                }
            }, 200); // Espera 200ms antes de redirigir
        });
    </script>

    <script src="/js/newUsuario.js"></script>
</body>
</html>
