<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión / Registrarse</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="wrapper">
        <div class="card-switch">
            <label class="switch">
               <input type="checkbox" class="toggle" checked>
                <span class="slider"></span>
                <span class="card-side"></span>
                <div class="flip-card__inner">
                    <div class="flip-card__front">
                        <div class="title">Iniciar Sesión</div>
                        <form class="flip-card__form" action="/login" method="POST">
                            <input class="flip-card__input" name="email" placeholder="Correo" type="email">
                            <input class="flip-card__input" name="password" placeholder="Contraseña" type="password">
                            <button type="submit" class="flip-card__btn">INICIAR</button>
                        </form>
                    </div>
                    <div class="flip-card__back">
                        <div class="title">Registrate</div>
                        <form class="flip-card__form" action="/register" method="POST">
                            <input class="flip-card__input" placeholder="Nombre" type="text">
                            <input class="flip-card__input" name="email" placeholder="Correo" type="email">
                            <input class="flip-card__input" name="password" placeholder="Contraseña" type="password">
                            <button type="submit" class="flip-card__btn">REGISTRAR</button>
                        </form>
                    </div>
                </div>
            </label>
        </div>
    </div>
</body>
</html>
